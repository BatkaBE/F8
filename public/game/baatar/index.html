<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Баатар - Тоглоом</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary-bg: #000;
            --secondary-bg: #111;
            --tertiary-bg: #222;
            --accent-bg: #333;
            --primary-text: #fff;
            --secondary-text: #aaa;
            --tertiary-text: #666;
            --border-color: #444;
        }
        * {
            margin: 0;                  
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: var(--primary-bg);
            color: var(--primary-text);
            line-height: 1.6;
        }   
        .navbar {
            width: 100%;
            background: var(--secondary-bg);
            padding: 12px 0;
            display: flex;
            justify-content: center;
            gap: 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 24px;
        }
        .nav-link {
            color: var(--primary-text);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            transition: color 0.2s;
        }
        .nav-link:hover {
            color: var(--accent-bg);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-link">Нүүр</a>
        <a href="/game" class="nav-link">Бусад тоглоомууд</a>
        <a href="javascript:history.back()" class="nav-link">Буцах</a>
    </nav>
    <div class="game-container">
        <div class="game-bg-strip">
            <img src="./../../assets/background1.png" class="bg-img" />
            <img src="./../../assets/background2.png" class="bg-img" />
            <img src="./../../assets/background3.png" class="bg-img" />
            <img src="./../../assets/background1.png" class="bg-img" />
            <img src="./../../assets/background2.png" class="bg-img" />
            <img src="./../../assets/background3.png" class="bg-img" />
        </div>
        <div class="score-card">
            <span>HI</span>
            <span class="high-score"></span>
            <span class="score"></span>
        </div>
        <div class="player"></div>
        <div class="obstacle"></div>
        <div class="restart-game">
            <div class="content">
                <span class="text">RESTART</span>
                <button onclick="restart()" class="btn-reset-game"></button>
            </div>
        </div>
        <button id="toggleMouthDetection" onclick="toggleMouthDetection()">Enable Mouth Control</button>
        <div id="cameraFeedback" class="camera-feedback"></div>
    </div>
    <script src="./app.js"></script>
</body>
</html>
